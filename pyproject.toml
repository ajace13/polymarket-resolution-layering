[project]
name = "polylayers"
version = "0.1.0"
description = "Can anything beat the market on Fed decisions? Point-in-time macro, news, Fed-text, and trader-graph layers measured against Polymarket's own price."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Aidan Long" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=15",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "torch>=2.4",
    "torch-geometric>=2.6",
]

[project.scripts]
polylayers = "polylayers.cli:main"

# CPU wheels everywhere: the graphs here have ~100-150 nodes, so a GPU buys nothing
# and CPU wheels keep CI and local installs identical.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polylayers"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests quote real Polymarket questions and FOMC statement sentences verbatim.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
